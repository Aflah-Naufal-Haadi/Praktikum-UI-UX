<!DOCTYPE html>
<html lang="en">
<head>
    <title>Menghitung Jumlah Dua Bilangan</title>
    <style>
        input {
            width: 250px;
            padding: 8px;
            margin: 5px 0;
            font-size: 18px;
        }
    </style>
    <script>
        function hitung() {
            let bil1 = Number(document.getElementById("bil1").value);
            let bil2 = Number(document.getElementById("bil2").value);

            document.getElementById("hasil").value = bil1 + bil2;
        }
    </script>
</head>
<body>
    <h2>Menghitung Jumlah Dua Bilangan</h2>

    <input type="number" id="bil1" onchange="hitung()" placeholder="Bilangan 1">
    <div style="font-size: 25px; margin-left: 5px;">+</div>
    <input type="number" id="bil2" onchange="hitung()" placeholder="Bilangan 2">
    <div style="font-size: 25px; margin-left: 5px;">=</div>
    <input type="number" id="hasil" readonly placeholder="Hasil">

</body>
</html>
